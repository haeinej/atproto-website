# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  source "$HOME/.nvm/nvm.sh"
  npm install --no-audit --no-fund
  npm install --prefix service --no-audit --no-fund
knowledge:
  - name: test
    contents: npm test
  - name: runtime
    contents: Node.js 22 or newer is required; this setup was verified with Node 24.
  - name: optional-components
    contents: Cirrus uses its own frozen pnpm lock; the archive importer requires JDK21 and Maven. Verify these components separately from the root Node suite.
